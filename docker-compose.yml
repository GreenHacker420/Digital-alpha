services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcpay}
      POSTGRES_USER: ${POSTGRES_USER:-arcpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcpay}
    ports:
      - "5432:5432"
    volumes:
      - arcpay_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcpay} -d ${POSTGRES_DB:-arcpay}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcpay_pgdata:
