[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "arcpay-api"
version = "0.1.0"
description = "Digital Alpha take-home API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.140.13",
  "uvicorn[standard]==0.51.0",
  "sqlalchemy==2.0.51",
  "greenlet>=3.1.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx>=0.28,<1.0",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
